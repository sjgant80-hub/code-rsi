name: proof
on: [push, pull_request, workflow_dispatch]
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: the conversion, the loop, the evaluator, the page, the pins (R5, R7, R10, R11) and the seal's own text
        run: node --test test/loop.test.mjs test/eval.test.mjs test/page.test.mjs
      - name: both 1,500-cycle runs re-derived from Rung 1's cell and the tune half, byte for byte (R8)
        run: node tools/loop.mjs --check
      - name: the blind-half record re-derived byte for byte (R1-R4, R6, R9)
        run: node tools/eval.mjs --check
      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break each kernel, then READ the verdict (must be CLEAN, nothing baselined)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          for k in semeion:src/semeion.mjs:test/loop.test.mjs loop:src/loop.mjs:test/loop.test.mjs eval:src/eval.mjs:test/eval.test.mjs; do
            IFS=: read -r name file tests <<< "$k"
            node /tmp/witness/witness.mjs mutate "$file" --timeout 120000 --cap 1000 --test node --test "$tests" > "verdict-$name.txt" 2>&1
            tail -3 "verdict-$name.txt"
            grep -q '"clean": true' "verdict-$name.txt" || { echo "::error::mutants survived in $file"; exit 1; }
            node tools/gate-receipt.mjs "$name" "$file" "verdict-$name.txt" --check
          done
